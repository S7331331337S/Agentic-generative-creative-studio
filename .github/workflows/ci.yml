name: CI

on:
  push:
    branches: [main, master, "copilot/**", "claude/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 24 is the active even LTS. 20.x remains the declared engines
        # floor (Vite 7 needs ^20.19 || >=22.12). Node 18 is EOL.
        node-version: [20.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      # Builds every workspace, frontend included. A type error in the UI is a
      # broken build and must fail here, not at someone's checkout.
      - name: Build all workspaces
        run: npm run build

      - name: Run backend tests with coverage thresholds
        run: npm run test:coverage -w backend

      - name: Run frontend tests
        run: npm run test -w frontend

      - name: Run CANVAS runtime tests
        run: npm run test -w canvas

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Build shared package (needed for type resolution)
        run: npm run build -w shared

      - name: Lint backend
        run: npm run lint -w backend

      - name: Lint frontend
        run: npm run lint -w frontend

      - name: Lint CANVAS runtime
        run: npm run lint -w canvas

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Fail on high or critical advisories
        run: npm audit --audit-level=high
